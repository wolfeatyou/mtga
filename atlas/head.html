<meta charset="utf-8">
<title>Hobbit Draft Atlas</title>
<style>
:root{
  --ground:#E9EDEA; --surface:#FBFCFB; --surface-2:#F2F5F2; --line:#CBD4CE; --line-soft:#DEE5E0;
  --ink:#141A17; --ink-2:#3A4642; --muted:#5C6864;
  --brass:#8F6522; --brass-soft:#F0E4CE;
  --win:#2F6A47; --loss:#94413A; --warn:#8A6A1E;
  --W:#B9A87C; --U:#3E7699; --B:#5A5361; --R:#A64F3E; --G:#487A50;
  --shadow:0 1px 2px rgba(20,26,23,.06), 0 8px 24px -18px rgba(20,26,23,.5);
  --serif:"Iowan Old Style","Hoefler Text","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Avenir Next",Avenir,"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"SF Mono",SFMono-Regular,Menlo,"Cascadia Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1311; --surface:#141C19; --surface-2:#1A2320; --line:#2C3833; --line-soft:#222D29;
  --ink:#E4EBE6; --ink-2:#B9C6BF; --muted:#8B9C94;
  --brass:#C79A4C; --brass-soft:#33291A;
  --win:#5FA87A; --loss:#C77168; --warn:#C0993F;
  --W:#CDBE93; --U:#5E9CC2; --B:#8B8194; --R:#C87361; --G:#6BA574;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0D1311; --surface:#141C19; --surface-2:#1A2320; --line:#2C3833; --line-soft:#222D29;
  --ink:#E4EBE6; --ink-2:#B9C6BF; --muted:#8B9C94;
  --brass:#C79A4C; --brass-soft:#33291A;
  --win:#5FA87A; --loss:#C77168; --warn:#C0993F;
  --W:#CDBE93; --U:#5E9CC2; --B:#8B8194; --R:#C87361; --G:#6BA574;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; text-wrap:balance; margin:0}
a{color:var(--brass)}
:focus-visible{outline:2px solid var(--brass); outline-offset:3px; border-radius:3px}

/* ---------- шапка ---------- */
header.masthead{border-bottom:1px solid var(--line); background:var(--surface)}
.masthead .wrap{display:flex; flex-wrap:wrap; gap:24px 40px; align-items:flex-end;
  justify-content:space-between; padding-top:34px; padding-bottom:26px}
.brand h1{font-size:clamp(30px,4.2vw,42px); line-height:1.06; letter-spacing:-.015em}
.brand .sub{color:var(--muted); font-size:14.5px; margin-top:8px; max-width:56ch}
.stamp{display:flex; gap:26px; font-family:var(--mono); font-size:12px; color:var(--muted)}
.stamp b{display:block; font-family:var(--sans); font-size:19px; color:var(--ink);
  font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.stamp span{display:block; text-transform:uppercase; letter-spacing:.09em; margin-top:3px}

/* ---------- навигация ---------- */
nav.jump{position:sticky; top:0; z-index:20; background:var(--ground);
  border-bottom:1px solid var(--line); backdrop-filter:blur(6px)}
nav.jump .wrap{display:flex; gap:2px; padding-top:0; padding-bottom:0; overflow-x:auto}
nav.jump a{display:block; padding:13px 16px; font-size:13.5px; text-decoration:none;
  color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap}
nav.jump a:hover{color:var(--ink)}
nav.jump a.on{color:var(--ink); border-bottom-color:var(--brass)}

section{padding:56px 0 8px}
.sechead{display:flex; align-items:baseline; gap:16px; margin-bottom:6px}
.sechead h2{font-size:26px; letter-spacing:-.01em}
.sechead .rule{flex:1; height:1px; background:var(--line)}
.sechead .count{font-family:var(--mono); font-size:12px; color:var(--muted);
  text-transform:uppercase; letter-spacing:.09em}
.lede{color:var(--ink-2); max-width:72ch; margin:14px 0 26px; font-size:15px}

/* ---------- чипы цветовой пары ---------- */
.pair{display:inline-flex; gap:3px; vertical-align:middle}
.pip{width:17px; height:17px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--mono); font-size:10px; font-weight:700; color:var(--surface);
  line-height:1; border:1px solid rgba(0,0,0,.14)}
.pip.W{background:var(--W); color:#2A2415} .pip.U{background:var(--U)}
.pip.B{background:var(--B)} .pip.R{background:var(--R)} .pip.G{background:var(--G)}

/* ---------- сравнительная таблица ---------- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:4px;
  background:var(--surface); box-shadow:var(--shadow)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{text-align:left; padding:11px 14px; border-bottom:1px solid var(--line-soft)}
thead th{font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--muted); font-weight:500; white-space:nowrap;
  background:var(--surface-2); border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.arch-name{font-family:var(--serif); font-size:15.5px}
.arch-name small{display:block; font-family:var(--sans); font-size:12.5px; color:var(--muted); margin-top:2px}

/* мини-бар в таблице — кодирует величину, не украшает */
.bar{display:flex; align-items:center; gap:8px; min-width:112px}
.bar i{flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden; display:block}
.bar i::after{content:""; display:block; height:100%; width:var(--v); background:var(--brass)}
.bar.good i::after{background:var(--win)}
.bar.bad i::after{background:var(--loss)}
.bar b{font-family:var(--mono); font-size:12.5px; font-weight:500;
  font-variant-numeric:tabular-nums; min-width:44px; text-align:right}

/* ---------- табы архетипов ---------- */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin:34px 0 0}
.tab{display:flex; align-items:center; gap:9px; padding:9px 14px; cursor:pointer;
  background:var(--surface); color:var(--ink-2); border:1px solid var(--line);
  border-radius:3px; font-family:var(--sans); font-size:13.5px; line-height:1}
.tab:hover{color:var(--ink); border-color:var(--muted)}
.tab[aria-selected="true"]{background:var(--brass-soft); border-color:var(--brass); color:var(--ink)}
.tab .pair{pointer-events:none}

.deck{border:1px solid var(--line); border-top:0; background:var(--surface);
  border-radius:0 0 4px 4px; box-shadow:var(--shadow)}
.deck-top{border-top:2px solid var(--brass); padding:24px 26px 20px;
  display:flex; flex-wrap:wrap; gap:22px 40px; justify-content:space-between; align-items:flex-start}
.deck-id h3{font-size:21px}
.deck-id .axes{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.axe{font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:2px;
  background:var(--surface-2); border:1px solid var(--line-soft); color:var(--ink-2)}
.metrics{display:flex; gap:26px; flex-wrap:wrap}
.metric b{display:block; font-size:20px; font-family:var(--sans); font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.metric span{display:block; font-family:var(--mono); font-size:10px; color:var(--muted);
  text-transform:uppercase; letter-spacing:.08em; margin-top:2px}

.deck-body{display:grid; grid-template-columns:1fr 1fr; gap:0}
.col{padding:20px 26px 26px}
.col+.col{border-left:1px solid var(--line-soft)}
.col h4{font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--muted); font-weight:500; margin-bottom:12px;
  padding-bottom:8px; border-bottom:1px solid var(--line-soft)}
ul.cards{list-style:none; margin:0; padding:0}
ul.cards li{display:grid; grid-template-columns:16px 1fr auto; gap:10px; align-items:baseline;
  padding:5px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px}
ul.cards li:last-child{border-bottom:0}
.qty{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
.cname{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
.cname .mc{font-family:var(--mono); font-size:11px; color:var(--muted)}
.rar{font-family:var(--mono); font-size:9.5px; font-weight:700; padding:1px 4px;
  border-radius:2px; letter-spacing:.04em}
.rar.M,.rar.R{background:var(--brass-soft); color:var(--brass); border:1px solid var(--brass)}
.rar.U{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
.rar.C{background:transparent; color:var(--muted); border:1px solid var(--line-soft)}
/* имя карты — кнопка: превью открывается и наведением, и с клавиатуры */
button.cn{font:inherit; color:inherit; background:none; border:0; padding:0; margin:0;
  cursor:help; text-align:left; border-bottom:1px dotted var(--line)}
button.cn:hover,button.cn:focus-visible{color:var(--brass); border-bottom-color:var(--brass)}
button.cn.noimg{cursor:default; border-bottom-color:transparent}

/* всплывающий принт */
#peek{position:fixed; z-index:80; pointer-events:none; margin:0; padding:0;
  opacity:0; visibility:hidden; transform:translateY(4px);
  transition:opacity .11s ease, transform .11s ease}
#peek.on{opacity:1; visibility:visible; transform:none}
#peek img{display:block; width:300px; height:auto; border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.28), 0 22px 48px -14px rgba(0,0,0,.55)}

.gih{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.gih.low{color:var(--muted)}
.axmark{display:inline-block; width:5px; height:5px; border-radius:50%;
  background:var(--brass); vertical-align:middle; margin-left:1px}

.deck-foot{border-top:1px solid var(--line-soft); padding:20px 26px 24px;
  display:grid; grid-template-columns:1fr 1fr; gap:22px 34px}
.deck-foot h5{font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--muted); font-weight:500; margin:0 0 7px}
.deck-foot p{margin:0; font-size:14px; color:var(--ink-2); max-width:60ch}
.deck-foot .weak p{color:var(--ink-2)}
.deck-foot .weak h5{color:var(--loss)}

/* ---------- пилюли результата ---------- */
.pill{display:inline-block; font-family:var(--mono); font-size:11px; font-weight:600;
  padding:2px 8px; border-radius:2px; letter-spacing:.03em}
.pill.w{background:color-mix(in srgb, var(--win) 15%, transparent); color:var(--win);
  border:1px solid color-mix(in srgb, var(--win) 45%, transparent)}
.pill.l{background:color-mix(in srgb, var(--loss) 14%, transparent); color:var(--loss);
  border:1px solid color-mix(in srgb, var(--loss) 45%, transparent)}
.tag{display:inline-block; font-family:var(--mono); font-size:10.5px; padding:2px 7px;
  border:1px solid var(--line); border-radius:2px; color:var(--ink-2); background:var(--surface-2);
  margin:2px 4px 2px 0; white-space:nowrap}
.tag.hot{border-color:var(--loss); color:var(--loss)}

.note{border-left:2px solid var(--brass); background:var(--surface); padding:16px 20px;
  margin:26px 0 0; font-size:14px; color:var(--ink-2); max-width:78ch; border-radius:0 3px 3px 0}
.note strong{color:var(--ink)}
.note.warn{border-left-color:var(--loss)}

footer{margin-top:64px; border-top:1px solid var(--line); background:var(--surface)}
footer .wrap{padding:26px 24px 40px; color:var(--muted); font-size:13px;
  display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap}
footer code{font-family:var(--mono); font-size:12px; color:var(--ink-2)}

@media (max-width:820px){
  .deck-body{grid-template-columns:1fr}
  .col+.col{border-left:0; border-top:1px solid var(--line-soft)}
  .deck-foot{grid-template-columns:1fr}
  .masthead .wrap{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
